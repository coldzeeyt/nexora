name: Windows release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/windows-release.yml', 'release-trigger.json']
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: true
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm install --prefix apps/api --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Publish Windows installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "preview-${{ github.run_number }}" "release/Nexora-Setup.exe" --title "Nexora Windows preview" --notes-file docs/release-notes.md --latest
