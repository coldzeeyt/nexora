name: Windows release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/windows-release.yml', 'release-trigger.json']
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: true
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm install --prefix apps/api --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Publish Windows installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          gh release create "v$version-build.${{ github.run_number }}" "release/Nexora-Setup.exe" "release/Nexora-Setup.exe.blockmap" "release/nexora.yml" "release-velora/Velora-Setup.exe" "release-velora/Velora-Setup.exe.blockmap" "release-velora/velora.yml" --title "Nexora and Velora $version" --notes-file docs/release-notes.md --latest