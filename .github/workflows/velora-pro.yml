name: Velora Pro preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/velora-pro.yml']
permissions:
  contents: write
concurrency:
  group: velora-pro-preview
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm install --prefix apps/api --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: node scripts/build-platform.cjs
        env:
          BUILD_APP: velora-pro
          BUILD_PLATFORM: ${{ matrix.platform }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node scripts/build-installer.cjs
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: pro-${{ matrix.platform }}
          path: |
            release-installer/${{ matrix.platform }}/*.exe
            release-installer/${{ matrix.platform }}/*.dmg
            release-platform/${{ matrix.platform }}/velora-pro/*.exe
            release-platform/${{ matrix.platform }}/velora-pro/*.blockmap
            release-platform/${{ matrix.platform }}/velora-pro/*.yml
            release-platform/${{ matrix.platform }}/velora-pro/*.dmg
            release-platform/${{ matrix.platform }}/velora-pro/*-mac.json
          compression-level: 0
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pro-*
          path: pro-assets
          merge-multiple: true
      - run: node scripts/build-pro-catalog.cjs pro-assets
      - name: Publish separate free preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view velora-pro-latest >/dev/null 2>&1; then
            gh release upload velora-pro-latest pro-assets/*.exe pro-assets/*.dmg pro-assets/*.yml pro-assets/*.json pro-assets/*.blockmap --clobber
            gh release edit velora-pro-latest --notes-file docs/velora-pro.md --prerelease --latest=false
          else
            gh release create velora-pro-latest pro-assets/*.exe pro-assets/*.dmg pro-assets/*.yml pro-assets/*.json pro-assets/*.blockmap --title 'Velora Pro — Free preview' --notes-file docs/velora-pro.md --prerelease --latest=false
          fi

# Flatten combined Pro and Installer artifacts before catalog verification.

# Pro 0.4.2 adds separate native workspace windows.

# Pro 0.4.3 protects each native workspace with its own process lock.

# Pro 0.4.4 fixes widget close controls and picker overlap.
